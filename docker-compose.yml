name: waba-lakehouse

x-spark-image: &spark-image
  build: ./spark
  image: waba-spark:latest
  env_file: .env
  environment:
    PYSPARK_PYTHON: python3

services:
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    env_file: .env
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb -p local/$${RAW_BUCKET} local/$${LAKEHOUSE_BUCKET} local/$${ARCHIVE_BUCKET} &&
             mc ls local"

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    user: "0"
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: s3://${LAKEHOUSE_BUCKET}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg.db
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${AWS_REGION}
    volumes: [iceberg-catalog:/catalog]
    depends_on:
      minio-init: {condition: service_completed_successfully}

  trino:
    image: trinodb/trino:470
    env_file: .env
    ports: ["8085:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/kafka:/etc/trino/kafka:ro
      - ./trino/queries:/queries:ro
    depends_on: [iceberg-rest]

  spark-master:
    <<: *spark-image
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports: ["8081:8080", "7077:7077"]
    volumes: [./spark/jobs:/opt/jobs]
    depends_on: [iceberg-rest]

  spark-worker:
    <<: *spark-image
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      PYSPARK_PYTHON: python3
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: 4g
    volumes: [./spark/jobs:/opt/jobs]
    depends_on: [spark-master]

  generator:
    build: ./generator
    env_file: .env
    environment:
      REF_CACHE: /data/referentials
    ports: ["8501:8501"]
    volumes: [generator-data:/data]
    depends_on:
      minio-init: {condition: service_completed_successfully}

  postgres:
    image: postgres:16
    profiles: [orchestration]
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20

  airflow:
    build: ./airflow
    profiles: [orchestration]
    hostname: airflow
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW_CONN_SPARK_WABA: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
      AIRFLOW_CONN_MINIO_WABA: '{"conn_type": "aws", "login": "${MINIO_ROOT_USER}", "password": "${MINIO_ROOT_PASSWORD}", "extra": {"endpoint_url": "http://minio:9000", "region_name": "${AWS_REGION}"}}'
      AIRFLOW_VAR_RAW_BUCKET: ${RAW_BUCKET}
      PYSPARK_PYTHON: python3
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username $${AIRFLOW_ADMIN_USER} --password $${AIRFLOW_ADMIN_PASSWORD}
                 --firstname WABA --lastname Admin --role Admin --email admin@example.com || true) &&
               (airflow scheduler &) && exec airflow webserver"
    ports: ["8088:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark/jobs:/opt/jobs
    depends_on:
      postgres: {condition: service_healthy}
      spark-master: {condition: service_started}

  kafka:
    image: apache/kafka:3.8.0
    profiles: [streaming]
    hostname: kafka
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 8

  kafka-init:
    image: apache/kafka:3.8.0
    profiles: [streaming]
    entrypoint: ["bash", "/scripts/create_topics.sh"]
    volumes: [./kafka:/scripts:ro]
    depends_on: [kafka]

  nifi:
    image: apache/nifi:1.28.1
    profiles: [streaming]
    ports: ["8090:8080"]
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state

  nifi-init:
    image: python:3.11-slim
    profiles: [streaming]
    env_file: .env
    command: sh -c "pip install -q -r /nifi/requirements.txt && python /nifi/setup_flow.py"
    volumes: [./nifi:/nifi:ro]
    depends_on:
      nifi: {condition: service_started}
      kafka-init: {condition: service_completed_successfully}

  stream-raw-to-silver:
    <<: *spark-image
    profiles: [streaming]
    restart: on-failure
    command: ["spark-submit", "--master", "local[2]", "--driver-memory", "1g", "/opt/jobs/streaming_raw_to_silver.py"]
    volumes: [./spark/jobs:/opt/jobs, checkpoints:/opt/checkpoints]
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  stream-silver-to-gold:
    <<: *spark-image
    profiles: [streaming]
    restart: on-failure
    command: ["spark-submit", "--master", "local[2]", "--driver-memory", "1g", "/opt/jobs/streaming_silver_to_gold.py"]
    volumes: [./spark/jobs:/opt/jobs, checkpoints:/opt/checkpoints]
    depends_on:
      kafka-init: {condition: service_completed_successfully}

volumes:
  minio-data:
  iceberg-catalog:
  generator-data:
  airflow-db:
  nifi-conf:
  nifi-state:
  checkpoints:
